
name: Deploy ChessNLPCoach to Azure

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: chessnlp-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name chessnlpacr

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t chessnlpacr.azurecr.io/chessnlp:${{ github.sha }} \
            .

      - name: Push Docker image to ACR
        run: |
          docker push \
            chessnlpacr.azurecr.io/chessnlp:${{ github.sha }}

      - name: Deploy image to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: chessNLPcoach
          images: chessnlpacr.azurecr.io/chessnlp:${{ github.sha }}
